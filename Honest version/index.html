<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>Liliet Gonzalez Polanco — AI-Enabled QA Strategist</title>
  <meta name="description" content="AI-Enabled QA Strategist portfolio with content separated from the presentation layer." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="nav">
    <a href="#top" class="brand" id="brandLink">
      <span class="brand-mark" id="brandMark">LG</span>
      <span class="brand-name" id="brandName">Liliet Gonzalez Polanco</span>
    </a>
    <nav class="nav-links" id="navLinks"></nav>
    <div class="nav-actions">
      <button class="lang-toggle" id="langToggle" aria-label="Toggle language">
        <span class="lang-on">EN</span> · <span class="lang-off">ES</span>
      </button>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
    </div>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-inner">
        <p class="eyebrow" id="heroEyebrow"></p>
        <h1 id="heroTitle"></h1>
        <p class="lead" id="heroLead"></p>
        <div class="badges" id="heroBadges"></div>
        <div class="cta-row" id="heroCtas"></div>
      </div>
    </section>

    <section id="about" class="section">
      <h2 id="aboutTitle"></h2>
      <div class="grid two-col">
        <div>
          <p id="aboutP1"></p>
          <p id="aboutP2"></p>
        </div>
        <aside class="card">
          <h3 id="factsTitle"></h3>
          <ul class="facts" id="factsList"></ul>
        </aside>
      </div>
    </section>

    <section id="impact" class="section section-alt">
      <h2 id="impactTitle"></h2>
      <div class="metrics" id="metricsList"></div>
    </section>

    <section id="skills" class="section">
      <h2 id="skillsTitle"></h2>
      <div class="skills-grid" id="skillsGrid"></div>
    </section>

    <section id="projects" class="section section-alt">
      <h2 id="projectsTitle"></h2>
      <div class="projects" id="projectsGrid"></div>
    </section>

    <section id="experience" class="section">
      <h2 id="experienceTitle"></h2>
      <ol class="timeline" id="timelineList"></ol>
    </section>

    <section id="contact" class="section section-alt contact">
      <h2 id="contactTitle"></h2>
      <p class="contact-lead" id="contactLead"></p>
      <div class="cta-row center" id="contactCtas"></div>
    </section>
  </main>

  <footer class="footer">
    <p><span id="footerYear"></span> <span id="footerName">Liliet Gonzalez Polanco</span> · <span id="footerTag"></span></p>
    <p class="small" id="footerBuilt"></p>
  </footer>

  <script src="assets/app.js"></script>
</body>
</html>
